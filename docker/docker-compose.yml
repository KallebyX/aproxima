services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aproxima:local
    container_name: aproxima-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: America/Sao_Paulo
      DATA_DIR: /app/data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate an ENCRYPTION_KEY before starting}
    volumes:
      - aproxima-local-data:/app/data

volumes:
  aproxima-local-data:
