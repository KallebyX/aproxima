# Build and publish the image before updating this stack in Portainer.
# APROXIMA_IMAGE should be an immutable GHCR digest or a full commit tag.
services:
  app:
    image: ${APROXIMA_IMAGE:?Set APROXIMA_IMAGE to the tested image digest}
    pull_policy: never
    container_name: aproxima-app
    restart: unless-stopped
    ports:
      - "${BIND_IP:-10.21.19.45}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: America/Sao_Paulo
      NEXT_PUBLIC_SITE_URL: https://aproxima.app.ufn.edu.br
      DATA_DIR: /app/data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set the persistent production encryption key}
      API_SECRET_KEY: ${API_SECRET_KEY:?Set the private staff API key}
      APP_REVISION: ${APP_REVISION:-unknown}
    volumes:
      - aproxima-runtime-data:/app/data
    networks:
      - aproxima-network

volumes:
  aproxima-runtime-data:
    name: aproxima-runtime-data

networks:
  aproxima-network:
    driver: bridge
